<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bonds & Loans Study Guide</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#1d1c24;--mute:#6b6a75;--line:#e4e2da;--accent:#4338ca;--accent2:#eceeff;--good:#0c8f61;--goodbg:#e4f6ee;--bad:#cf3434;--badbg:#fdeaea;--warn:#b26f00;--warnbg:#fff3d9;--shadow:0 1px 2px rgba(20,20,40,.05),0 8px 24px rgba(20,20,40,.06)}
:root[data-theme=dark]{--bg:#111117;--card:#1b1b24;--ink:#ececf2;--mute:#9b9aaa;--line:#2f2f3c;--accent:#9596ff;--accent2:#25254a;--good:#34d399;--goodbg:#11332a;--bad:#f87171;--badbg:#3a1a1d;--warn:#fbbf24;--warnbg:#3a2d10;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.03em}
h2{font-size:24px}h3{font-size:17px}
p{margin:0 0 .8em}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hin{max-width:1080px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:7px 12px;border-radius:99px;font-size:14px;font-weight:600;color:var(--mute);white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{background:var(--ink);color:var(--bg)}
.tog{border:1px solid var(--line);background:var(--card);border-radius:99px;width:36px;height:36px;flex:none}
main{max-width:1080px;margin:auto;padding:28px 16px 80px}
section{display:none;animation:in .35s ease}
section.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.mute{color:var(--mute)}.small{font-size:13.5px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.btn{border:0;background:var(--accent);color:#fff;font-weight:700;padding:11px 20px;border-radius:12px;transition:transform .1s,filter .15s}
:root[data-theme=dark] .btn:not(.ghost){color:#14142a}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:14px;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-size:13.5px;font-weight:600;color:var(--mute)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme=dark] .chip.on{color:#14142a}
/* home */
.hero{padding:26px 4px 22px}
.hero p{font-size:18px;color:var(--mute);max-width:620px}
.step{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.step:hover{transform:translateY(-3px);border-color:var(--accent)}
.step{display:flex;flex-direction:column;justify-content:flex-start;color:var(--ink)}
.step .meter{margin-top:auto}.step .meter+span{margin-top:8px}.step>span.mute{margin-bottom:14px}
.step .n{align-self:flex-start;width:30px;height:30px;border-radius:10px;background:var(--accent2);color:var(--accent);display:grid;place-items:center;font-weight:800;margin-bottom:12px}
.step b{display:block;font-size:17px;margin-bottom:2px}
.meter{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.more{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
/* learn */
.learn{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
.tlist{position:sticky;top:74px;display:flex;flex-direction:column;gap:4px}
.tlist button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:10px 12px;border-radius:12px;font-weight:600;font-size:14.5px;color:var(--mute)}
.tlist button .d{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;color:#fff}
.tlist button.done .d{background:var(--good);border-color:var(--good)}
.tlist button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
@media(max-width:780px){.learn{grid-template-columns:1fr}.tlist{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}.tlist button{white-space:nowrap}}
.lesson>*+*{margin-top:16px}
.idea{font-size:19px;line-height:1.45;border-left:4px solid var(--accent);padding:4px 0 4px 16px;margin:10px 0 4px}
.lab{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.fx{background:var(--accent2);border-radius:14px;padding:14px 18px;margin:8px 0;font-size:18px;font-family:Cambria,"Times New Roman",serif;overflow-x:auto;white-space:nowrap}
.fx small{display:block;font:600 12px system-ui;color:var(--accent);letter-spacing:.03em;margin-bottom:6px;white-space:normal}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 6px 1px}
.fr>span:last-child{padding:1px 6px 0}
ol.steps{margin:0;padding-left:22px}ol.steps li{margin-bottom:6px}
.ex{background:var(--goodbg);border-radius:14px;padding:14px 18px}
.ex b.t{color:var(--good)}
.warnb{background:var(--warnbg);border-radius:14px;padding:14px 18px}
.warnb b.t{color:var(--warn)}
.warnb ul,.ex ul{margin:6px 0 0;padding-left:20px}
/* widgets */
.ctrl{display:grid;gap:10px;margin-bottom:16px}
.sl{display:grid;grid-template-columns:minmax(120px,190px) 1fr 84px;align-items:center;gap:12px;font-size:14px;font-weight:600}
.sl b{text-align:right;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
@media(max-width:520px){.sl{grid-template-columns:1fr 70px}.sl input{grid-column:1/-1;grid-row:2}}
.bars{display:flex;align-items:flex-end;gap:6px}
.col{flex:1;min-width:0;text-align:center}
.bv{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;height:18px;white-space:nowrap}
.bw{display:flex;align-items:flex-end;border-radius:8px 8px 0 0}
.bw.ghost{background:repeating-linear-gradient(135deg,var(--line) 0 4px,transparent 4px 8px)}
.bar{width:100%;background:var(--accent);border-radius:8px 8px 0 0;transition:height .6s cubic-bezier(.2,.8,.2,1),background .3s}
.bar.hot{background:var(--good)}.bar.dim{opacity:.45}.bar.red{background:var(--bad)}
.bl{font-size:11.5px;color:var(--mute);margin-top:5px;white-space:nowrap}
.cap{margin:14px 0 0;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--bg);border-radius:12px;padding:10px 14px}
.stat span{display:block;font-size:12px;color:var(--mute);font-weight:600}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:800}
.pill.g{background:var(--goodbg);color:var(--good)}.pill.r{background:var(--badbg);color:var(--bad)}.pill.n{background:var(--accent2);color:var(--accent)}
.saw{height:104px;position:relative;margin-top:56px}
.beam{position:absolute;left:10%;right:10%;top:44px;height:8px;background:var(--ink);border-radius:8px;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.beam span{position:absolute;top:-36px;padding:4px 12px;border-radius:99px;font-size:12.5px;font-weight:800;background:var(--accent2);color:var(--accent)}
.beam .l{left:-10px}.beam .r{right:-10px}
.piv{position:absolute;left:50%;top:52px;transform:translateX(-50%);border:24px solid transparent;border-bottom:40px solid var(--line);border-top:0}
.chart{width:100%;max-width:520px;display:block;margin:auto;overflow:visible}
.chart .ax{stroke:var(--line);stroke-width:2}
.chart text{fill:var(--mute);font-size:11px;font-weight:600}
.chart .ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart .main{stroke:var(--accent)}.chart .alt{stroke:var(--mute);stroke-dasharray:5 6}
.chart .mt{fill:var(--accent);font-size:12px;font-weight:800}
.chart circle.main{fill:var(--card);stroke:var(--accent);stroke-width:3}
.sd .dline{stroke:var(--accent);stroke-width:4;stroke-linecap:round}.sd .sline{stroke:var(--good);stroke-width:4;stroke-linecap:round}
.sd .gh{stroke:var(--line);stroke-width:3;stroke-dasharray:4 6}
.sd .dt{fill:var(--accent);font-size:12px;font-weight:800}.sd .st{fill:var(--good);font-size:12px;font-weight:800}
.sd .pl{stroke:var(--mute);stroke-dasharray:3 5;stroke-width:1.5}.sd .dot{fill:var(--ink)}
.sd .mv{transition:transform .9s cubic-bezier(.3,.9,.3,1)}
.tug{position:relative;height:44px;border-radius:99px;background:linear-gradient(90deg,var(--goodbg),var(--bg) 50%,var(--accent2));margin-top:16px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:13px;font-weight:800}
.tug i{position:absolute;top:4px;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:var(--ink);transition:left .6s cubic-bezier(.3,1.4,.5,1)}
.inl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:15px}
.inl input{width:74px;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;text-align:center}
.hm{height:12px;background:var(--line);border-radius:9px;position:relative;margin:6px 0 14px}
.hm i{position:absolute;top:-4px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--accent);transition:left .6s cubic-bezier(.3,1.2,.5,1)}
.hm u{position:absolute;top:0;bottom:0;width:2px;background:var(--mute)}
/* questions */
.qwrap{max-width:720px;margin:auto}
.qtag{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.qq{font-size:18px;font-weight:600;margin-bottom:16px;line-height:1.45}
.qq table{border-collapse:collapse;margin:12px 0 0;font-size:14.5px;font-weight:500}
.qq td,.qq th{border:1px solid var(--line);padding:6px 12px;text-align:center}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:12px 14px;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:var(--accent)}
.opt i{flex:none;width:28px;height:28px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.opt.sel{border-color:var(--accent);background:var(--accent2)}
.opt.ok{border-color:var(--good);background:var(--goodbg)}.opt.ok i{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--badbg);animation:shake .35s}.opt.no i{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:14px;border-radius:13px;padding:14px 16px;font-size:15px;display:none}
.fb.ok{display:block;background:var(--goodbg)}.fb.no{display:block;background:var(--badbg)}
.fb b.h{display:block;margin-bottom:4px}
.fb.ok b.h{color:var(--good)}.fb.no b.h{color:var(--bad)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.score{font-weight:800;font-variant-numeric:tabular-nums}
/* flashcards */
.fc{perspective:1400px;height:320px;cursor:pointer;max-width:620px;margin:auto}
.fci{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d}
.fc.flip .fci{transform:rotateY(180deg)}
.fc.na .fci{transition:none}
.fcf,.fcb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.fcf{font-size:22px;font-weight:700;line-height:1.35}
.fcb{transform:rotateY(180deg);font-size:18px}
.fcb .fx{font-size:17px;margin-top:10px}
.fct{position:absolute;top:16px;left:20px;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.fch{position:absolute;bottom:14px;font-size:12.5px;color:var(--mute);font-weight:500}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:620px;margin:16px auto 0}
.rate button{border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:10px 4px;font-weight:800}
.rate button small{display:block;font-weight:600;color:var(--mute);font-size:12px}
.rate .r1{color:var(--bad)}.rate .r2{color:var(--warn)}.rate .r3{color:var(--good)}.rate .r4{color:var(--accent)}
.rate button:hover{border-color:currentColor}
.counts{display:flex;gap:14px;justify-content:center;font-size:13.5px;font-weight:700;margin-bottom:14px}
.counts span b{font-variant-numeric:tabular-nums}
/* blanks */
.bk{padding:14px 0;border-bottom:1px solid var(--line);font-size:16.5px;line-height:2.1}
.bk:last-of-type{border:0}
.bk input{width:118px;border:0;border-bottom:2px solid var(--mute);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;text-align:center;padding:2px 6px;border-radius:6px 6px 0 0;outline:0}
.bk input:focus{border-color:var(--accent)}
.bk input.ok{border-color:var(--good);background:var(--goodbg);color:var(--good)}
.bk input.no{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.bk .ans{display:none;font-size:13.5px;color:var(--good);font-weight:700;line-height:1.4}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.bank span{background:var(--accent2);color:var(--accent);border-radius:8px;padding:3px 10px;font-size:13.5px;font-weight:700}
/* match */
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.match button{border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:12px 14px;text-align:left;font-size:14.5px;min-height:58px;transition:all .2s}
.match button.sel{border-color:var(--accent);background:var(--accent2)}
.match button.ok{border-color:var(--good);background:var(--goodbg);opacity:.55;pointer-events:none}
.match button.no{animation:shake .35s;border-color:var(--bad)}
.match .mc{display:grid;gap:8px;align-content:start}
/* test */
.timer{font-weight:800;font-variant-numeric:tabular-nums;font-size:18px;padding:4px 14px;border-radius:99px;background:var(--accent2);color:var(--accent)}
.timer.low{background:var(--badbg);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.pal button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:700}
.pal button.a{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:32px;font-weight:800}
.rev{border-top:1px solid var(--line);padding:16px 0}
.rev .m{font-weight:800}.rev .m.ok{color:var(--good)}.rev .m.no{color:var(--bad)}
table.tb{width:100%;border-collapse:collapse;font-size:14.5px}
table.tb td,table.tb th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.sheet .card h3{color:var(--accent)}
@media print{header,.noprint{display:none}section{display:none!important}#sheet{display:block!important}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header><div class="hin">
  <div class="brand"><i>%</i>Bonds &amp; Loans</div>
  <nav id="nav"></nav>
  <button class="tog" id="theme" title="Light / dark">◐</button>
</div></header>
<main>
  <section id="home"></section>
  <section id="learn"><div class="learn"><div class="tlist" id="tlist"></div><div class="lesson" id="lesson"></div></div></section>
  <section id="cards"></section>
  <section id="practice"></section>
  <section id="blanks"></section>
  <section id="tf"></section>
  <section id="match"></section>
  <section id="test"></section>
  <section id="sheet"></section>
</main>
<script>
/* ---------- helpers & saved progress ---------- */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const m=x=>(x<0?'−':'')+'$'+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const m0=x=>'$'+Math.round(x).toLocaleString('en-US');
const p2=x=>x.toFixed(2)+'%';
const g=x=>String(+x.toFixed(5));
const AF=(r,n)=>r===0?n:(1-Math.pow(1+r,-n))/r;
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const KEY='bondsGuide.v1';
let S={cards:{},learned:{},best:{},stat:{},theme:null};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const record=(t,ok)=>{const s=S.stat[t]||(S.stat[t]=[0,0]);s[1]++;if(ok)s[0]++;save()};
const T={pv:'Present value',loan:'Loans & annuities',bond:'Coupon bonds',comp:'Compounding returns',risk:'Interest-rate risk',real:'Real vs. nominal rates',sd:'Bond supply & demand',term:'Term structure',spread:'Spreads & signals'};
const TK=Object.keys(T);

/* ---------- lessons ---------- */
const LESSONS={
pv:{idea:'A dollar later is worth less than a dollar today. To bring future money back to today, divide by (1 + i) once for every year you wait.',
 fx:[['Present value of one payment',`PV = ${fr('FV','(1 + i)<sup>n</sup>')}`],['Future value',`FV = PV × (1 + i)<sup>n</sup>`]],
 steps:['Write the interest rate as a decimal: 10% → 0.10.','Raise (1 + i) to the number of years: 1.10<sup>3</sup> = 1.331.','Divide the future payment by that number.'],
 wt:'Watch the denominator eat the payment',
 ex:'$50 arriving in 3 years at 10%: 50 ÷ 1.10<sup>3</sup> = 50 ÷ 1.331 = <b>$37.57</b>. Why? Because $37.57 invested today at 10% grows to exactly $50 in 3 years.',
 bad:['Dividing by (1 + i × n) instead of (1 + i)<sup>n</sup>. Interest compounds, so use the exponent.','Using the same exponent for every payment. Each payment gets the exponent of <i>its own</i> year.']},
loan:{idea:'A loan is the present value of all the payments you promise. The bank gives you today what your future payments are worth today.',
 fx:[['Loan amount (payments of C for n periods)',`Loan = ${fr('C','(1 + i)')} + ${fr('C','(1 + i)<sup>2</sup>')} + … + ${fr('C','(1 + i)<sup>n</sup>')}`],['Shortcut (annuity factor)',`Loan = C × ${fr('1 − (1 + i)<sup>−n</sup>','i')}`],['Monthly payments','use i ÷ 12 as the rate and years × 12 as n'],['Minimum cash flow to justify a purchase',`C = ${fr('Cost − Resale ÷ (1 + i)<sup>n</sup>','annuity factor')}`]],
 steps:['Decide the period (year or month) and match the rate to it.','Discount every payment back to today.','Add them up. That sum is the most a lender will give you.'],
 wt:'How big a loan do your payments buy?',

 <div class="rate" id="rate" style="visibility:${fcFlip?'visible':'hidden'}">${[['Again',1],['Hard',2],['Good',3],['Easy',4]].map(([n,r])=>`<button class="r${r}" data-r="${r}">${n}<small>${fmtI(nextI(st,r))}</small></button>`).join('')}</div></div>`;el.innerHTML=h;
  $('#fc').onclick=()=>{fcFlip=!fcFlip;$('#fc').classList.toggle('flip',fcFlip);$('#rate').style.visibility=fcFlip?'visible':'hidden'};$$('#rate button').forEach(b=>b.onclick=()=>fcRate(+b.dataset.r))}
 $$('.chip',el).forEach(b=>b.onclick=()=>{fcTopic=b.dataset.t;fcFlip=false;fcBuild();fcRender()});
 if($('#fcall'))$('#fcall').onclick=()=>{fcBuild(1);fcRender()};if($('#fcreset'))$('#fcreset').onclick=()=>{ids.forEach(i=>delete S.cards[i]);save();fcBuild();fcRender()}}
function fcRate(r){if(!fcQ.length||!fcFlip)return;const id=fcQ.shift(),c=cs(id),iv=nextI(c,r);c.seen++;c.due=Date.now()+iv;c.ivl=iv>=DAY?iv/DAY:0;if(r===1)fcQ.splice(Math.min(3,fcQ.length),0,id);else if(r===2&&iv<DAY)fcQ.splice(Math.min(7,fcQ.length),0,id);save();fcFlip=false;fcRender()}
document.addEventListener('keydown',e=>{if(curTab!=='cards'||!$('#fc'))return;if(e.code==='Space'){e.preventDefault();$('#fc').click()}else if(fcFlip&&'1234'.includes(e.key))fcRate(+e.key)});

/* practice + true/false drills */
function drill(id,title,blurb,getQ,topics){const st={t:'',n:0,ok:0,streak:0};PAGE[id]=()=>{const el=$('#'+id);
 el.innerHTML=`<div class="qwrap"><h2>${title}</h2><p class="mute">${blurb}</p>${topics?`<div class="chips"><button class="chip ${st.t?'':'on'}" data-t="">All topics</button>${TK.map(k=>`<button class="chip ${st.t===k?'on':''}" data-t="${k}">${T[k]}</button>`).join('')}</div>`:''}<div class="bar2"><span class="score">Score <span class="sc">${st.ok} / ${st.n}</span></span><span class="pill n stk">Streak ${st.streak}</span></div><div class="card"><div class="q"></div><button class="btn nxt" style="margin-top:16px;display:none">Next question →</button></div></div>`;
 const nq=()=>{$('.nxt',el).style.display='none';qCard($('.q',el),getQ(st.t),ok=>{st.n++;if(ok){st.ok++;st.streak++}else st.streak=0;$('.sc',el).textContent=`${st.ok} / ${st.n}`;$('.stk',el).textContent='Streak '+st.streak;$('.nxt',el).style.display=''})};
 $('.nxt',el).onclick=nq;$$('.chip',el).forEach(b=>b.onclick=()=>{st.t=b.dataset.t;PAGE[id]()});nq()}}
drill('practice','Practice problems','New numbers every time. The wrong choices are the answers you get from the most common mistakes, so work each one out.',nextQ,true);
drill('tf','True or false','Decide quickly, then read why.',t=>{let pool=TF.filter(q=>(!t||q.topic===t)&&!usedT.includes(q));if(!pool.length){usedT=usedT.filter(q=>t&&q.topic!==t);pool=TF.filter(q=>!t||q.topic===t)}const q=pick(pool);usedT.push(q);return q},true);

/* fill in the blanks */
let blSet=null;
PAGE.blanks=()=>{if(!blSet)blSet=shuffle(BL).slice(0,7);const el=$('#blanks'),bank=shuffle(blSet.flatMap(b=>b[2].map(a=>Array.isArray(a)?a[0]:String(a))));
 el.innerHTML=`<div class="qwrap"><h2>Fill in the blanks</h2><p class="mute">Type the missing word or number. Use the word bank if you get stuck.</p><div class="card"><div class="lab">Word bank</div><div class="bank">${bank.map(w=>`<span>${w}</span>`).join('')}</div>${blSet.map((b,i)=>{let j=0;return `<div class="bk">${i+1}. ${b[1].replace(/___/g,()=>`<input data-i="${i}" data-j="${j++}" autocomplete="off" spellcheck="false">`)}<div class="ans">Answer: ${b[2].map(a=>Array.isArray(a)?a[0]:a).join(', ')}</div></div>`}).join('')}
 <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center"><button class="btn chk">Check answers</button><button class="btn ghost shw">Show answers</button><button class="btn ghost new">New set</button><b class="res"></b></div></div></div>`;
 const norm=s=>s.toLowerCase().replace(/[$%,]/g,'').trim();
 $('.chk',el).onclick=()=>{let ok=0,n=0;$$('.bk input',el).forEach(inp=>{const b=blSet[inp.dataset.i],a=b[2][inp.dataset.j],v=norm(inp.value),good=Array.isArray(a)?a.includes(v):v!==''&&Math.abs(parseFloat(v)-a)<=.011;inp.className=good?'ok':'no';n++;if(good)ok++;record(b[0],good)});$('.res',el).textContent=`${ok} of ${n} correct`};
 $('.shw',el).onclick=()=>$$('.ans',el).forEach(a=>a.style.display='block');$('.new',el).onclick=()=>{blSet=null;PAGE.blanks()}};

/* matching game */
PAGE.match=()=>{const el=$('#match'),ps=shuffle(PAIRS).slice(0,6),L=shuffle(ps),Rr=shuffle(ps);let sel=null,left=6,t0=Date.now(),miss=0;
 el.innerHTML=`<div class="qwrap"><h2>Matching game</h2><p class="mute">Click a term, then click its meaning. ${S.best.match?'Your best time: '+S.best.match+' seconds.':''}</p><div class="match"><div class="mc">${L.map(p=>`<button data-a="${PAIRS.indexOf(p)}"><b>${p[0]}</b></button>`).join('')}</div><div class="mc">${Rr.map(p=>`<button data-b="${PAIRS.indexOf(p)}">${p[1]}</button>`).join('')}</div></div><p class="cap res"></p><button class="btn ghost again" style="margin-top:8px">New game</button></div>`;
 $$('[data-a]',el).forEach(b=>b.onclick=()=>{$$('[data-a]',el).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b});
 $$('[data-b]',el).forEach(b=>b.onclick=()=>{if(!sel)return;if(sel.dataset.a===b.dataset.b){sel.className='ok';b.className='ok';sel=null;if(--left===0){const s=Math.round((Date.now()-t0)/1000);if(!S.best.match||s<S.best.match){S.best.match=s;save()}$('.res',el).innerHTML=`<b>Done in ${s} seconds</b> with ${miss} miss${miss===1?'':'es'}.`}}else{miss++;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400)}});
 $('.again',el).onclick=PAGE.match};

/* tests */
let TS=null,tick=null;
function buildTest(n){const ng=Math.round(n*.45),ns=Math.round(n*.3),gk=shuffle(Object.keys(GEN)),qs=[];for(let i=0;i<ng;i++)qs.push(GEN[gk[i%gk.length]]());shuffle(SMC).slice(0,ns).forEach(s=>qs.push(smcQ(s)));shuffle(TF).slice(0,n-qs.length).forEach(q=>qs.push(q));return shuffle(qs)}
PAGE.test=()=>{if(TS&&!TS.done)return testRender();const el=$('#test'),opt=[['Practice test','20 questions, no time limit',20,0],['Quick quiz','10 questions in 8 minutes',10,8],['Timed test','20 questions in 20 minutes',20,20],['Final exam','30 questions in 30 minutes',30,30]];
 el.innerHTML=`<div class="qwrap"><h2>Tests</h2><p class="mute">Mixed questions from every topic. You see your score and the explanations at the end. ${S.best.test?'Your best score so far: <b>'+S.best.test+'%</b>.':''}</p><div class="grid g2">${opt.map((o,k)=>`<button class="step" data-k="${k}"><div class="n">${o[3]?'⏱':'✎'}</div><b>${o[0]}</b><span class="mute small">${o[1]}</span></button>`).join('')}</div></div>`;
 $$('.step',el).forEach(b=>b.onclick=()=>{const o=opt[b.dataset.k];TS={qs:buildTest(o[2]),ans:Array(o[2]).fill(null),i:0,mins:o[3],name:o[0],end:o[3]?Date.now()+o[3]*6e4:0,done:false};clearInterval(tick);if(o[3])tick=setInterval(testTick,250);testRender()})};
function testTick(){if(!TS||TS.done)return clearInterval(tick);const r=TS.end-Date.now(),t=$('#timer');if(r<=0)return testDone();if(t){const s=Math.ceil(r/1000);t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');t.classList.toggle('low',s<=60)}}
function testRender(){const el=$('#test'),q=TS.qs[TS.i],n=TS.qs.length,a=TS.ans;
 el.innerHTML=`<div class="qwrap"><div class="bar2"><b>${TS.name} · Question ${TS.i+1} of ${n}</b>${TS.mins?'<span class="timer" id="timer"></span>':''}</div><div class="meter" style="margin:0 0 16px"><i style="width:${a.filter(x=>x!==null).length/n*100}%"></i></div>
 <div class="card"><div class="qtag">${T[q.topic]}</div><div class="qq">${q.q}</div><div class="opts">${q.choices.map((c,k)=>`<button class="opt ${a[TS.i]===k?'sel':''}" data-k="${k}"><i>${q.choices.length===2?'TF'[k]:'ABCD'[k]}</i><span>${c}</span></button>`).join('')}</div>
 <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="btn ghost pv" ${TS.i?'':'disabled style="opacity:.4"'}>← Back</button>${TS.i<n-1?'<button class="btn nx">Next →</button>':''}<button class="btn ${TS.i<n-1?'ghost':''} fin" style="margin-left:auto">Finish test</button></div>
 <div class="pal">${a.map((x,k)=>`<button class="${x!==null?'a':''} ${k===TS.i?'cur':''}" data-j="${k}">${k+1}</button>`).join('')}</div></div></div>`;
 $$('.opt',el).forEach(b=>b.onclick=()=>{a[TS.i]=+b.dataset.k;testRender()});$('.pv',el).onclick=()=>{if(TS.i){TS.i--;testRender()}};if($('.nx',el))$('.nx',el).onclick=()=>{TS.i++;testRender()};$$('.pal button',el).forEach(b=>b.onclick=()=>{TS.i=+b.dataset.j;testRender()});
 $('.fin',el).onclick=()=>{const un=a.filter(x=>x===null).length;if(!un||confirm(un+' question'+(un>1?'s are':' is')+' unanswered. Finish anyway?'))testDone()};if(TS.mins)testTick()}
function testDone(){clearInterval(tick);TS.done=true;const el=$('#test'),n=TS.qs.length,by={};let ok=0;TS.qs.forEach((q,k)=>{const good=TS.ans[k]===q.answer;if(good)ok++;record(q.topic,good);const b=by[q.topic]||(by[q.topic]=[0,0]);b[1]++;if(good)b[0]++});const p=Math.round(ok/n*100);if(p>(S.best.test||0)){S.best.test=p;save()}
 el.innerHTML=`<div class="qwrap"><div class="card" style="text-align:center"><div class="ring" style="--p:${p}"><div>${p}%</div></div><h2>${ok} of ${n} correct</h2><p class="mute">${p>=90?'Excellent. You are ready.':p>=75?'Solid. Review the misses below and you are there.':p>=50?'Getting there. Revisit the weak topics in Learn.':'Go back through the lessons, then try again.'}</p><button class="btn again">Take another test</button>
 <table class="tb" style="margin-top:20px"><tr><th>Topic</th><th>Score</th></tr>${Object.keys(by).map(k=>`<tr><td>${T[k]}</td><td><b style="color:${by[k][0]===by[k][1]?'var(--good)':by[k][0]/by[k][1]<.5?'var(--bad)':'inherit'}">${by[k][0]} / ${by[k][1]}</b></td></tr>`).join('')}</table></div>
 <div class="card" style="margin-top:16px"><div class="lab">Review</div>${TS.qs.map((q,k)=>{const good=TS.ans[k]===q.answer;return `<div class="rev"><div class="m ${good?'ok':'no'}">${good?'✓':'✗'} Question ${k+1} · ${T[q.topic]}</div><div class="qq" style="font-size:16px;margin:6px 0 8px">${q.q}</div><div class="small">${good?'':`Your answer: <b style="color:var(--bad)">${TS.ans[k]===null?'(blank)':q.choices[TS.ans[k]]}</b><br>`}Correct answer: <b style="color:var(--good)">${q.choices[q.answer]}</b></div><p class="small mute" style="margin:6px 0 0">${q.explain}</p></div>`}).join('')}</div></div>`;
 $('.again',el).onclick=()=>{TS=null;PAGE.test()};window.scrollTo(0,0)}

/* formula sheet */
PAGE.sheet=()=>{$('#sheet').innerHTML=`<div class="bar2"><div><h2 style="margin:0">Formula sheet</h2><span class="mute">Every formula from the nine lessons on one page.</span></div><button class="btn ghost sm noprint" onclick="print()">Print</button></div><div class="grid g2 sheet">${TK.map(k=>`<div class="card"><h3>${T[k]}</h3>${LESSONS[k].fx.map(f=>`<div class="fx" style="font-size:16px;white-space:normal"><small>${f[0]}</small>${f[1]}</div>`).join('')}<p class="small mute" style="margin:8px 0 0">${LESSONS[k].ex}</p></div>`).join('')}</div>`};

/* ---------- start ---------- */
$('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
$$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
const setTheme=t=>{document.documentElement.dataset.theme=t};
setTheme(S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('#theme').onclick=()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(S.theme);save()};
go('home');
</script>
